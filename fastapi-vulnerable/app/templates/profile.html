{% extends "base.html" %}{% block title %}나의 방 · 달빛 고양이{% endblock %}{% block content %}
<section class="narrow"><div class="section-heading"><div><span class="eyebrow">MY MOON ROOM</span><h1>{{ user.nickname|safe }}의 방</h1></div></div>{% if request.query_params.get('updated') %}<div class="success">별빛 정보가 바뀌었어요.</div>{% endif %}<div class="form-card large"><form method="post"><div class="two-col"><label>아이디<input value="{{ user.user_id|safe }}" disabled></label><label>이름<input value="{{ user.name|safe }}" disabled></label><label>새 비밀번호<input type="password" name="password" placeholder="변경할 때만 입력"></label><label>닉네임<input name="nickname" value="{{ user.nickname|safe }}"></label><label>나이<input type="number" name="age" value="{{ user.age }}"></label><label>이메일<input name="email" value="{{ user.email|safe }}"></label></div><button class="button primary wide">정보 수정하기</button></form></div></section>
{% endblock %}
