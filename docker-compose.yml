name: webtestsite_unified
services:
  nginx:
    image: nginx:alpine
    networks: [default, lab]
    ports: ["0.0.0.0:8000:80"]
    volumes:
      - ./new_hub:/usr/share/nginx/html:ro
      - ./hub/lab:/opt/pnp-lab:ro
      - ./hub/nginx.conf:/etc/nginx/conf.d/default.conf:ro
  manager:
    networks: [default, ingress]
    env_file: .env
    build: ./hub/manager
    working_dir: /workspace
    environment:
      PNP_MANAGED_LABS: ${PNP_MANAGED_LABS:-true}
      PNP_LAB_DOMAIN: ${PNP_LAB_DOMAIN:-labs.localhost}
      PNP_LAB_SCHEME: ${PNP_LAB_SCHEME:-http}
      PNP_LAB_PORT: ${PNP_LAB_PORT-8000}
      PNP_COOKIE_SECURE: ${PNP_COOKIE_SECURE:-false}
      PNP_MAX_SESSIONS: ${PNP_MAX_SESSIONS:-5}
      PNP_INGRESS_NETWORK: ${PNP_INGRESS_NETWORK:-pnp-lab-ingress}
      PNP_ORIGINS: ${PNP_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      PNP_AUTH_PROXY_HOST: nginx
      COMPOSE_PROJECT_NAME: webtestsite_unified
      PNP_MODE: ${PNP_MODE:-dev}
    volumes:
      - .:/workspace:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - lab_sessions:/state
  php:
    build: .
    networks: [default, lab]
    volumes:
      - ./src/board/upload:/var/www/html/board/upload
      - ./shared/style.css:/var/www/html/shared/style.css:ro
    ports: ["127.0.0.1:10001:80"]
    depends_on:
      db:
        condition: service_healthy
  python:
    build: ./fastapi-vulnerable
    env_file: .env
    networks: [default, lab]
    ports: ["127.0.0.1:10002:8000"]
    environment:
      DB_HOST: db
      DB_NAME: WebTest
      DB_USER: mooncat
      DB_PASSWORD: mooncat123
      MONGO_URI: mongodb://mongo:27017
      PNP_MODE: ${PNP_MODE:-dev}
    volumes:
      - ./src/board/upload:/app/app/uploads
      - ./shared/style.css:/app/app/static/style.css:ro
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_healthy
  spring:
    build: ./spring-vulnerable
    networks: [default, lab]
    ports: ["127.0.0.1:10003:8080"]
    environment:
      DB_HOST: db
      DB_NAME: WebTest
      DB_USER: mooncat
      DB_PASSWORD: mooncat123
      UPLOAD_DIR: /app/uploads
      SPRING_WEB_RESOURCES_STATIC_LOCATIONS: "file:/app/shared/,classpath:/static/"
    volumes:
      - ./src/board/upload:/app/uploads
      - ./shared/style.css:/app/shared/style.css:ro
    depends_on:
      db:
        condition: service_healthy
  tools-proxy:
    build: ./tools-proxy
    networks: [lab]
    environment:
      PNP_ORIGINS: ${PNP_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
  attacker:
    build: ./attacker
    networks: [default, lab]
    environment:
      PNP_MODE: ${PNP_MODE:-dev}
      PNP_ORIGINS: ${PNP_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      ATTACKER_PAGE_TTL: ${ATTACKER_PAGE_TTL:-7200}
    ports: ["127.0.0.1:10010:8000"]
  shell:
    build: ./hub/shell
    networks: [lab]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m", "/home/student:rw,nosuid,size=32m,uid=1000,gid=1000"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 64
  db:
    image: mariadb:11.4
    ports: ["127.0.0.1:13306:3306"]
    environment:
      MARIADB_ROOT_PASSWORD: "P@ssw0rd"
    volumes:
      - unified_db:/var/lib/mysql
      - ./unified-init:/docker-entrypoint-initdb.d:ro
      - ./db-init/01-webtest.sql:/schemas/php.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
  mongo:
    image: mongo:7.0
    networks: [lab]
    volumes:
      - mongo_test:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  lab_sessions:
  unified_db:
  mongo_test:
networks:
  ingress:
    name: ${PNP_INGRESS_NETWORK:-pnp-lab-ingress}
    internal: true
  lab:
    internal: true

