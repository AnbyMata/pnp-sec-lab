<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('달빛 고양이 아틀리에')}"></head><body><div class="glow glow-one"></div><div class="glow glow-two"></div><header th:replace="~{fragments :: header}"></header><main class="page-shell"><section class="hero"><div class="hero-copy"><span class="eyebrow">MOONCAT ATELIER · SPRING</span><h1>오늘 밤,<br><em>고양이들의 비밀</em>을<br>만나 보세요.</h1><p>운세와 타로, 신비한 수수께끼가 모이는 달빛 아틀리에예요. 당신의 이야기를 별빛 게시판에 남겨 주세요.</p><div class="hero-actions"><a class="button primary" href="/board">이야기 보러 가기</a><a class="button ghost" href="/oracle">수정구슬 열기</a></div></div><div class="hero-art"><div class="spark s1">✦</div><div class="spark s2">✧</div><div class="spark s3">✦</div><img src="/cats-hero.png" alt="운세, 타로, 탐정을 맡은 보라색 고양이 세 마리"></div></section><section class="feature-grid"><article class="feature"><span class="feature-icon">☾</span><h3>오늘의 운세</h3><p>달빛을 따라온 작은 행운을 발견해요.</p></article><article class="feature"><span class="feature-icon">✦</span><h3>별자리 타로</h3><p>마음속 질문을 카드에 살짝 건네 보세요.</p></article><article class="feature"><span class="feature-icon">⌕</span><h3>고양이 탐정</h3><p>수상한 이야기의 실마리를 함께 찾아요.</p></article></section><section class="latest"><div class="section-heading"><div><span class="eyebrow">LATEST STORIES</span><h2>최근 별빛 이야기</h2></div><a href="/board">모두 보기 →</a></div><div class="story-list"><a class="story-card" th:each="post,stat:${latest}" th:href="@{/board/{id}(id=${post.id})}"><span class="story-no" th:text="${#numbers.formatInteger(stat.count,2)}">01</span><div><h3 th:utext="${post.subject}">제목</h3><p><span th:utext="${post.author}">작성자</span> · 조회 <span th:text="${post.view_count}">0</span></p></div><span>↗</span></a></div></section></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
