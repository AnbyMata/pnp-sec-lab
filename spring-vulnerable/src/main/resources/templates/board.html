<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('탐험 일지 · NEBULA')}"></head><body><div class="glow glow-one"></div><div class="glow glow-two"></div><header th:replace="~{fragments :: header}"></header><main class="page-shell"><section class="board-hero"><div><span class="eyebrow">STARRY BOARD · SPRING</span><h1>탐험 일지</h1><p>새로운 발견과 항해의 기록을 나눠요.</p></div><a class="button primary" href="/board/write">새 이야기 쓰기</a></section><form class="search-bar" method="get"><select name="field"><option value="subject" th:selected="${field=='subject'}">제목</option><option value="content" th:selected="${field=='content'}">내용</option><option value="author" th:selected="${field=='author'}">작성자</option></select><input name="keyword" th:value="${keyword}" placeholder="탐험 일지 검색"><button>검색</button></form><p class="search-summary" th:if="${!keyword.isBlank()}"><strong th:utext="${keyword}">검색어</strong> 검색 결과 <span th:text="${posts.size()}">0</span>개</p><div class="board-table"><div class="board-row board-head"><span>번호</span><span>제목</span><span>작성자</span><span>날짜</span><span>조회</span></div><a class="board-row" th:each="post:${posts}" th:href="@{/board/{id}(id=${post.id})}"><span th:text="${post.id}">1</span><span class="subject" th:utext="${post.subject}">제목</span><span th:utext="${post.author}">작성자</span><span th:text="${post.created_at}">날짜</span><span th:text="${post.view_count}">0</span></a><div class="empty" th:if="${posts.isEmpty()}">아직 탐험 일지가 없어요.</div></div></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
