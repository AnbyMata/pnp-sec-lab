<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('이야기 쓰기 · 달빛 고양이')}"></head><body><div class="glow glow-one"></div><header th:replace="~{fragments :: header}"></header><main class="page-shell"><section class="narrow"><div class="section-heading"><div><span class="eyebrow">NEW STORY</span><h1>새 이야기 쓰기</h1></div></div><div class="form-card large"><form method="post" enctype="multipart/form-data"><div class="two-col"><label>작성자<input name="author" th:value="${nickname}" required></label><label>글 비밀번호<input type="password" name="password" required></label></div><label>이메일<input name="email"></label><label>제목<input name="subject" required></label><label>내용<textarea name="content" rows="10" required></textarea></label><div class="option-row"><label class="check"><input type="checkbox" name="allowHtml" value="T" checked> HTML로 꾸미기</label><label class="file">첨부 파일<input type="file" name="attachment"></label></div><button class="button primary wide">별빛 게시하기</button></form></div></section></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
