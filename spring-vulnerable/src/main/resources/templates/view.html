<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('이야기 · NEBULA')}"></head><body><div class="glow glow-one"></div><header th:replace="~{fragments :: header}"></header><main class="page-shell"><article class="post" th:if="${post != null}"><div class="post-top"><span class="eyebrow" th:text="${'STORY #' + post.id}">STORY</span><h1 th:utext="${post.subject}">제목</h1><div class="post-meta"><span th:utext="${post.author}">작성자</span><span th:text="${post.created_at}">날짜</span><span th:text="${'조회 ' + post.view_count}">조회</span></div></div><div class="post-body" th:if="${post.allow_html=='T'}" th:utext="${post.content}"></div><div class="post-body" th:unless="${post.allow_html=='T'}" th:text="${post.content}"></div><a class="attachment" th:if="${post.filename != null and !post.filename.toString().isBlank()}" th:href="@{/uploads/{name}(name=${post.filename})}">📎 <span th:utext="${post.filename}">파일</span></a><div class="post-actions"><a class="button ghost" href="/board">목록으로</a><form method="post" th:action="@{/board/{id}/delete(id=${postId})}"><input type="password" name="password" placeholder="글 비밀번호"><button class="button danger">삭제</button></form></div></article><div class="empty-state" th:unless="${post != null}"><span>☾</span><h1>이야기를 찾지 못했어요</h1><a class="button primary" href="/board">게시판으로</a></div></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
