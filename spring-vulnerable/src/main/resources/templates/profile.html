<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('나의 방 · 달빛 고양이')}"></head><body><div class="glow glow-one"></div><header th:replace="~{fragments :: header}"></header><main class="page-shell"><section class="narrow"><div class="section-heading"><div><span class="eyebrow">MY MOON ROOM</span><h1 th:utext="${user.nickname} + '의 방'">나의 방</h1></div></div><div class="success" th:if="${updated == '1'}">별빛 정보가 바뀌었어요.</div><div class="form-card large"><form method="post"><div class="two-col"><label>아이디<input th:value="${user.user_id}" disabled></label><label>이름<input th:value="${user.name}" disabled></label><label>새 비밀번호<input type="password" name="password" placeholder="변경할 때만 입력"></label><label>닉네임<input name="nickname" th:value="${user.nickname}"></label><label>나이<input type="number" name="age" th:value="${user.age}"></label><label>이메일<input name="email" th:value="${user.email}"></label></div><button class="button primary wide">정보 수정하기</button></form></div></section></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
