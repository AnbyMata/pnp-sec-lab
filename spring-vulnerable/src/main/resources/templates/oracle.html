<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('심우주 관측 · NEBULA')}"></head><body><div class="glow glow-one"></div><div class="glow glow-two"></div><header th:replace="~{fragments :: header}"></header><main class="page-shell"><section class="oracle-layout"><div class="oracle-copy"><span class="eyebrow">DEEP SPACE OBSERVATORY · SPRING</span><h1>심우주 관측으로<br>먼 곳을 들여다봐요.</h1><p>관측할 주소를 입력하면 항구의 탐사기가 신호를 수신합니다.</p><img class="observatory-planet" src="/static/planet-purple.png" alt="" aria-hidden="true"></div><div class="form-card"><form method="get"><label>들여다볼 주소<input type="url" name="url" th:value="${url}" placeholder="http://example.com" required></label><button class="button primary wide">심우주 관측 비추기</button></form><div class="alert" th:if="${error}" th:utext="${error}"></div><pre class="oracle-result" th:if="${result}" th:utext="${result}"></pre></div></section></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
