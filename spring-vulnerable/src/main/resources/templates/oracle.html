<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('수정구슬 · 달빛 고양이')}"></head><body><div class="glow glow-one"></div><div class="glow glow-two"></div><header th:replace="~{fragments :: header}"></header><main class="page-shell"><section class="oracle-layout"><div class="oracle-copy"><span class="eyebrow">CRYSTAL ORACLE · SPRING</span><h1>수정구슬로<br>먼 곳을 들여다봐요.</h1><p>궁금한 주소를 적으면 타로 고양이가 그곳의 첫 장면을 보여드려요.</p><div class="orb">☾</div></div><div class="form-card"><form method="get"><label>들여다볼 주소<input type="url" name="url" th:value="${url}" placeholder="http://example.com" required></label><button class="button primary wide">수정구슬 비추기</button></form><div class="alert" th:if="${error}" th:utext="${error}"></div><pre class="oracle-result" th:if="${result}" th:utext="${result}"></pre></div></section></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
