spring.application.name=mooncat-spring-vulnerable
spring.datasource.url=jdbc:mariadb://${DB_HOST:db}:${DB_PORT:3306}/${DB_NAME:WebTest}?useUnicode=true&characterEncoding=utf8
spring.datasource.username=${DB_USER:mooncat}
spring.datasource.password=${DB_PASSWORD:mooncat123}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
server.servlet.session.cookie.same-site=lax
server.error.include-message=always
server.error.include-stacktrace=on_param
