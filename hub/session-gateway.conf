map $http_x_lab_target $lab_upstream {
    default "";
    python python:8000;
    php php:80;
    spring spring:8080;
}
server {
    listen 80;
    client_max_body_size 2m;
    resolver 127.0.0.11 valid=5s;
    # The three apps use different URLs for the same shared base stylesheet.
    # Keep it in the image instead of relying on host-only bind mounts.
    location = /static/style.css { alias /usr/share/nginx/html/lab-base.css; }
    location = /shared/style.css { alias /usr/share/nginx/html/lab-base.css; }
    location = /style.css { alias /usr/share/nginx/html/lab-base.css; }
    location / {
        if ($lab_upstream = "") { return 404; }
        proxy_pass http://$lab_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Lab-Target "";
    }
}
