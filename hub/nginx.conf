server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index home.html;
    add_header Cache-Control "no-store" always;
    location = /index.html {
        add_header Cache-Control "no-store";
    }
    location = /login.js {
        add_header Cache-Control "no-store";
    }
    location /lab/ {
        alias /opt/pnp-lab/;
    }
    location = /api/lab/session {
        resolver 127.0.0.11 valid=10s;
        set $python http://python:8000;
        proxy_pass $python/lab/session;
    }
    location = /api/challenges/sqli-login/verify {
        resolver 127.0.0.11 valid=10s;
        set $python http://python:8000;
        proxy_pass $python/lab/challenges/sqli-login/verify;
    }
    location /api/challenges/ {
        resolver 127.0.0.11 valid=10s;
        set $python http://python:8000;
        rewrite ^/api/challenges/(.*)$ /lab/challenges/$1 break;
        proxy_pass $python;
    }
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $manager http://manager:8765;
        proxy_pass $manager;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
    }
}
