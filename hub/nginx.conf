server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index home.html;
    add_header Cache-Control "no-store" always;
    location = /index.html {
        add_header Cache-Control "no-store";
    }
    location = /login.js {
        add_header Cache-Control "no-store";
    }
    location /lab/ {
        alias /opt/pnp-lab/;
    }
    location /api/lab/ {
        resolver 127.0.0.11 valid=10s;
        set $manager http://manager:8765;
        proxy_pass $manager;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
    }
    location /api/challenges/ {
        resolver 127.0.0.11 valid=10s;
        set $manager http://manager:8765;
        proxy_pass $manager;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
    }
    location /api/ {
        # Overwrite client-supplied values; never trust arbitrary X-Forwarded-For.
        proxy_set_header X-Pnp-Client-IP $remote_addr;
        client_max_body_size 2m;
        proxy_read_timeout 40s;
        resolver 127.0.0.11 valid=10s;
        set $manager http://manager:8765;
        proxy_pass $manager;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
    }
}

# Distinct origin for vulnerable lab pages. Use a separate registrable domain in production.
server {
    listen 80;
    server_name "~^(python|php|spring)-[a-f0-9]{48}\..+$";
    client_max_body_size 2m;
    location / {
        resolver 127.0.0.11 valid=10s;
        set $manager http://manager:8765;
        proxy_pass $manager;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 40s;
    }
}
